<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChessNotate • Fix your scoresheet, don't just validate it.</title>
  <meta name="description" content="Type your handwritten chess scoresheet into ChessNotate for a clean PGN. It catches every illegal move and lets you fix it in place, not branch into a new variation.">
  <link rel="canonical" href="https://chessnotate.app/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chessnotate.app/">
  <meta property="og:title" content="ChessNotate • Fix your scoresheet, don't just validate it.">
  <meta property="og:description" content="Type your handwritten chess scoresheet into ChessNotate for a clean PGN. It catches every illegal move and lets you fix it in place, not branch into a new variation.">
  <meta property="og:image" content="https://chessnotate.app/img/logo.png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ChessNotate • Fix your scoresheet, don't just validate it.">
  <meta name="twitter:description" content="Type your handwritten chess scoresheet into ChessNotate for a clean PGN. It catches every illegal move and lets you fix it in place, not branch into a new variation.">
  <meta name="twitter:image" content="https://chessnotate.app/img/logo.png">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
  <link rel="apple-touch-icon" href="img/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <div class="wrap">
      <img class="logo" src="img/logo.svg" alt="ChessNotate logo">
      <h1 class="wordmark">ChessNotate</h1>
      <p class="tagline">Type your scoresheet, catch every illegal move, and fix it in place. No branching, no restarting from scratch.</p>
      <div class="cta-row">
        <a class="badge" href="https://apps.apple.com/us/app/chessnotate/id6807725737" target="_blank" rel="noopener">
          <img src="img/appstore.svg" alt="Download on the App Store">
        </a>
        <a class="badge" href="web/">
          <img src="img/webapp.svg" alt="Try the free web version">
        </a>
      </div>
    </div>
  </section>

  <section class="screenshots">
    <div class="wrap">
      <h2>See it in action</h2>
      <div class="screenshot-grid">
        <figure>
          <img src="img/screen-invalid-move.png" alt="Flags invalid moves">
          <figcaption>
            <p class="caption-title">Flags invalid moves</p>
            <p class="caption-sub">Checked against the rules of chess, fix them in place.</p>
          </figcaption>
        </figure>
        <figure>
          <img src="img/screen-insert-move.png" alt="Insert skipped moves">
          <figcaption>
            <p class="caption-title">Insert skipped moves</p>
            <p class="caption-sub">Skipped moves shouldn't mean retyping the whole game.</p>
          </figcaption>
        </figure>
        <figure>
          <img src="img/screen-pgn-entry.png" alt="Chess notation keypad">
          <figcaption>
            <p class="caption-title">Chess notation keypad</p>
            <p class="caption-sub">Built for chess notation, not a generic keyboard.</p>
          </figcaption>
        </figure>
      </div>
    </div>
  </section>

  <footer>
    <p>Built with ❤️ by BitCraft Solutions</p>
    <p style="margin-top:10px;">
      <a href="/support">Support</a> · <a href="/privacy-policy">Privacy Policy</a>
    </p>
  </footer>

</body>
</html>
